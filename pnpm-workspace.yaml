packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
# @kobalte/solidbase 0.6.x imports these without declaring them.
packageExtensions:
  '@kobalte/solidbase':
    dependencies:
      resolve: ^1.22.10
      esbuild: ^0.25.0
# solidbase 0.6 pins @solidjs/router 0.15; use the app's router (1.x, same API as 0.16) so only one loads.
overrides:
  '@kobalte/solidbase>@solidjs/router': ^1.0.1
