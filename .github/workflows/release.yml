name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish packages
    if: github.repository == 'stefan-karger/solid-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm build:cli

      - name: Create the version pull request or publish
        uses: changesets/action@v2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
